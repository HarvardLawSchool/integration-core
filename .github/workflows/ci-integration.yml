### Reusable CI Workflow
# Called by integration repos via:
#   uses: HarvardLawSchool/integration-core/.github/workflows/ci-integration.yml@main
#
# *** BREAKING CHANGE WARNING ***
# This workflow is referenced at @main by all integration repos.
# Any breaking change here (changed deno-version, removed or reordered steps)
# takes effect IMMEDIATELY across every integration on their next CI run.
#
# Before merging changes to this file:
#   1. Test against at least one integration repo manually
#   2. Announce changes to integration developers
#   3. Consider using a feature branch and updating integrations one at a time
#
# Non-breaking changes (new optional inputs with defaults, added steps) are safe.

name: CI Integration (Reusable)

on:
  workflow_call:

# if two CI's are running based on action (e.g., pull_request & push), second cancels first because we only need one
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

# Callers can't widen this; each job grants only what it needs.
permissions: {}

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Update both together, deliberately — check https://github.com/gitleaks/gitleaks/releases
      # SHA256 is the linux_x64 line of gitleaks_<version>_checksums.txt for that release.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Download, verify, then extract: never pipe an unverified download into tar.
      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --verbose \
            --no-git \
            --redact

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: gitleaks # block all CI steps if secrets are found
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "v2.9.x"

      - name: Cache Deno modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Audit # fail fast: reads lockfile, can catch problems before an install
        run: deno audit --socket --level=critical

      - name: Check config
        run: |
          deno eval --no-lock "
            const { parse } = await import('jsr:@std/jsonc@1');
            const file = await Deno.readTextFile('deno.json').catch(() => Deno.readTextFile('deno.jsonc'));
            const { fmt = {} } = parse(file);
            const overrides = Object.keys(fmt).filter(k => !['include', 'exclude'].includes(k));
            if (overrides.length > 0) { console.error('Forbidden fmt overrides:', overrides.join(', ')); Deno.exit(1); }
          "

      - name: Format
        run: deno fmt --check --ignore="**/*.sql"

      - name: Lint
        run: deno lint

      - name: Type Check
        run: deno check

      - name: Test
        run: deno test --permit-no-files
