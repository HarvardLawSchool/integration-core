# Reusable Deploy Infra Workflow
# Called by integration repos via:
#   uses: [ORG]/[REPO]/.github/workflows/deploy-infra.yml@main
#
# *** BREAKING CHANGE WARNING ***
# This workflow is referenced at @main by all integration repos.
# Any breaking change here (renamed inputs, changed SAM flags, removed steps)
# takes effect IMMEDIATELY across every integration on their next run.
#
# Before merging changes to this file:
#   1. Test against at least one integration repo manually
#   2. Announce changes to integration developers
#   3. Consider using a feature branch and updating integrations one at a time
#
# Non-breaking changes (new optional inputs with defaults, added steps) are safe.
#
# Convention: integration repos must have app-infra-template.yml at project root.

name: Deploy Infra (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate config file exists
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Environment names become a file path and stack-name suffix: allow only a-z, 0-9, -
          if ! [[ "$ENVIRONMENT" =~ ^[a-z0-9-]+$ ]]; then
            echo "❌ Invalid environment name '$ENVIRONMENT'"
            exit 1
          fi
          CONFIG=".github/integration.config.$ENVIRONMENT"
          if [ ! -f "$CONFIG" ]; then
            echo "❌ No config file found for environment '$ENVIRONMENT'"
            echo "   Expected: $CONFIG"
            exit 1
          fi

      - name: Read integration config
        id: config
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          source ".github/integration.config.$ENVIRONMENT"
          echo "app_stack_name=$STACK_NAME"           >> "$GITHUB_OUTPUT"
          echo "aws_region=$AWS_REGION"               >> "$GITHUB_OUTPUT"
          echo "aws_role_arn=$AWS_ROLE_ARN"           >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$SAM_DEPLOYMENT_BUCKET"     >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.config.outputs.aws_role_arn }}
          aws-region: ${{ steps.config.outputs.aws_region }}

      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
          version: "1.171.0" # manual bumps: Dependabot updates the action, not this input

      - name: SAM deploy infra stack
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APP_STACK_NAME: ${{ steps.config.outputs.app_stack_name }}
          S3_BUCKET: ${{ steps.config.outputs.s3_bucket }}
          DEPLOY_REGION: ${{ steps.config.outputs.aws_region }}
        run: |
          sam deploy \
            --template-file ./app-infra-template.yml \
            --stack-name "${APP_STACK_NAME}-infra-${ENVIRONMENT}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket "$S3_BUCKET" \
            --region "$DEPLOY_REGION" \
            --parameter-overrides \
              "AppStackName=${APP_STACK_NAME}" \
              "Environment=${ENVIRONMENT}"
